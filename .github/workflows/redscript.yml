name: Lint RedScripts

on:
  workflow_call:
  pull_request:
    branches: ["master"]
    paths:
      - "**.reds"

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache libs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: libs
          key: libs
      - name: Download libs
        run: .\download-libs.ps1
      - uses: jac3km4/redscript-action@v0.1.3
        with:
          source: .
          lint: true
          check-format: true
